[project]
name = "cooling-twin"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "psychrolib",
    "ruptures",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "SALib", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PD"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true

# pandas, scipy, psychrolib, and ruptures ship no py.typed marker and no
# maintained stub package that mypy can trust without cascading into
# hundreds of DataFrame/Series false positives (pandas-stubs was tried
# and reverted -- see 07_PROGRESS.md Session 008). Silencing
# import-untyped for exactly these four keeps mypy checking every line
# WE wrote while not blocking CI on third-party typing that is out of
# this project's control.
[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "psychrolib.*", "ruptures.*"]
ignore_missing_imports = true
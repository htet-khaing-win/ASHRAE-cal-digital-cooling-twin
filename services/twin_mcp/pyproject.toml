[project]
name = "twin-mcp"
version = "0.1.0"
description = "MCP server exposing the cooling digital twin's read, simulate and apply tools."
requires-python = ">=3.11,<3.12"

# This is the ONLY package permitted to import `cooling_twin`. It is the
# adapter: physics on one side, an MCP tool contract on the other. The
# gateway talks to this over MCP and never imports either.
#
# `cooling-twin` is unpinned here because both live in one repo and are
# installed editable from the same checkout; the git tag on the twin is
# what records which state this was built against. If this package is
# ever published separately, pin it.
dependencies = [
    "cooling-twin",
    "mcp",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["twin_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["mcp.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true
